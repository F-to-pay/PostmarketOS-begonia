; begonia headphones (MT6785 + MT6359). Volume - 'Headset Volume' (0..20, 1 dB/step, ignore_dB=1 in default.pa).
; This path does NOT touch HP Mux (for safety reasons the output is enabled by hand: hp-on / hp-off).
; When switching to the headphones it kills the speaker route, otherwise sound would go there too.
[General]
priority = 9900
description-key = analog-output-headphones

[Properties]
device.icon_name = audio-headphones

[Element Headset]
required-any = any
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

[Element Speaker]
switch = off
volume = ignore

[Element I2S3_CH1 DL1_CH1]
switch = off
volume = off

[Element I2S3_CH1 DL1_CH2]
switch = off
volume = off

[Element I2S3_CH2 DL1_CH2]
switch = off
volume = off

; 3.5 mm jack detection: the port is available when the card jack control "Headphone Jack" = on.
; With the headphones unplugged the port is UNAVAILABLE ("no"): PulseAudio drops it from the active ones and switches to the speaker (jack-auto.sh enables the speaker with the filter).
[Jack Headphone]
state.plugged = yes
state.unplugged = no
