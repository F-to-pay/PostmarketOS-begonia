; PulseAudio/ACP profile set for begonia (MT6785 + MT6359): output - DL1 (hw:X,0), input - UL1 (hw:X,4).
; Hooked up by the udev rule /etc/udev/rules.d/90-mt6785-audio.rules (PULSE_PROFILE_SET).
[General]
auto-profiles = no

[Mapping analog-stereo-out]
description = Headphones / Speaker
device-strings = hw:%f,0
channel-map = left,right
paths-output = /home/user/Begonia/wifi/audio/analog-output-headphones /home/user/Begonia/wifi/audio/analog-output-speaker
direction = output

[Mapping analog-stereo-in]
description = Internal Microphone
device-strings = hw:%f,4
channel-map = left,right
paths-input = /home/user/Begonia/wifi/audio/mt6785-mic.conf
direction = input

[Profile output:analog-stereo+input:analog-stereo]
description = Headphones + Internal Microphone
output-mappings = analog-stereo-out
input-mappings = analog-stereo-in
priority = 100
