# Redmi Note 8 Pro (begonia)
# CONNSYS is brought up by begonia-wifi.service (with reboot loop protection), not by udev from DT
blacklist consys_bringup
options consys_bringup fw_dir=/usr/lib/firmware/begonia-connsys
# microphones: the main AIN0 and the top (noise suppression) AIN2 in DCC mode
options snd_soc_mt6359 mic_type0=3 mic_type1=3 mic_type2=3
