; begonia loudspeaker: SmartPA TFA9874 on I2S3 (mono, slot 0 = sum of L+R: DL1_CH1 + DL1_CH2 -> I2S3_CH1).
; The volume is in hardware: the ALSA control "Speaker Volume" of the tfa9874 driver (0..56, 0.5 dB step, 100% = -18 dB from the vendor
; maximum: above that the speaker rasps, the system will not go higher). The amplifier is powered only while a stream runs.
; Selection: spk-on [percent] / spk-off (or pactl set-sink-port ... analog-output-speaker).
[General]
priority = 100
description-key = analog-output-speaker

[Properties]
device.icon_name = audio-speakers

[Element Speaker]
switch = on
volume = merge

[Element I2S3_CH1 DL1_CH1]
switch = on
volume = off

[Element I2S3_CH1 DL1_CH2]
switch = on
volume = off

[Element I2S3_CH2 DL1_CH2]
switch = on
volume = off
